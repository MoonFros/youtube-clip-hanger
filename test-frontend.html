<!DOCTYPE html>
<html>
<head>
  <title>Test Backend - YouTube Clip Hanger</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #111; color: #eee; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: white; color: black; border: none; cursor: pointer; font-weight: bold; }
    button.secondary { background: #333; color: #eee; }
    .log { background: #222; padding: 10px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 11px; max-height: 400px; overflow-y: auto; }
    .section { border: 1px solid #333; padding: 15px; margin: 15px 0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>YouTube Clip Hanger - Test</h1>
  
  <div class="section">
    <h3>1. Health Check</h3>
    <button onclick="testHealth()">GET /api/health</button>
  </div>

  <div class="section">
    <h3>2. YouTube URL (CORRECT)</h3>
    <input id="url" placeholder="YouTube URL" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
    <input id="start" placeholder="Start" value="00:00:05">
    <input id="end" placeholder="End" value="00:00:15">
    <button onclick="testCreate()">POST {url, start_time, end_time} - WORKS</button>
  </div>

  <div class="section">
    <h3>3. File Upload (CORRECT - uses FormData)</h3>
    <input type="file" id="file" accept="video/*">
    <input id="start2" placeholder="Start" value="00:00:02">
    <input id="end2" placeholder="End" value="00:00:08">
    <button onclick="testUpload()">POST FormData with file - WORKS</button>
  </div>

  <div class="section">
    <h3>4. Broken format (your current error)</h3>
    <button class="secondary" onclick="testBroken()">POST {source: {type: upload}} - BROKEN, no file</button>
  </div>
  
  <div id="log" class="log">Logs will appear here...</div>

<script>
  const logEl = document.getElementById('log');
  function log(msg, isErr) {
    logEl.innerHTML += `\n${isErr ? '❌' : '✅'} ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function testHealth() {
    try {
      const res = await fetch('/api/health');
      const data = await res.json();
      log(`Health ${res.status}: ${JSON.stringify(data, null, 2)}`, !res.ok);
    } catch(e) {
      log(`Health failed: ${e.message}`, true);
    }
  }

  async function testCreate() {
    const url = document.getElementById('url').value;
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    try {
      const res = await fetch('/api/jobs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url, start_time: start, end_time: end })
      });
      const data = await res.json();
      log(`YouTube Create ${res.status}: ${JSON.stringify(data, null, 2)}`, !res.ok);
    } catch(e) {
      log(`Create failed: ${e.message}`, true);
    }
  }

  async function testUpload() {
    const fileInput = document.getElementById('file');
    const start = document.getElementById('start2').value;
    const end = document.getElementById('end2').value;
    if (!fileInput.files[0]) {
      log('Please select a file first!', true);
      return;
    }
    try {
      const form = new FormData();
      form.append('file', fileInput.files[0]);
      form.append('start_time', start);
      form.append('end_time', end);
      
      log(`Uploading ${fileInput.files[0].name} (${(fileInput.files[0].size/1024/1024).toFixed(2)} MB)...`);
      
      const res = await fetch('/api/jobs', {
        method: 'POST',
        body: form // Don't set Content-Type, browser sets multipart/form-data
      });
      const data = await res.json();
      log(`Upload ${res.status}: ${JSON.stringify(data, null, 2)}`, !res.ok);
    } catch(e) {
      log(`Upload failed: ${e.message}`, true);
    }
  }

  async function testBroken() {
    try {
      const res = await fetch('/api/jobs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ source: { type: 'upload' } })
      });
      const data = await res.json();
      log(`Broken format ${res.status}: ${JSON.stringify(data, null, 2)}`, !res.ok);
    } catch(e) {
      log(`Broken failed: ${e.message}`, true);
    }
  }
</script>
</body>
</html>
